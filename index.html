<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Compte Google TV</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0d1b2a;
    color:white;
}

.box{
    padding:20px;
}

.solde{
    background:green;
    padding:20px;
    border-radius:15px;
    font-size:25px;
}

.btn{
    background:#00c896;
    padding:15px;
    margin-top:20px;
    text-align:center;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="box">

<h2>Bonjour, <span id="nom">Client</span></h2>

<div class="solde">
Montant disponible <br>
<b id="solde">0 FCFA</b>
</div>

<br>

<div>
Numéro retrait : <b id="numero">00000000</b>
</div>

<div class="btn" onclick="alerte()">
💸 Demander un retrait
</div>

</div>

<script>
function alerte(){
    alert("Contactez votre leader pour votre retrait");
}

/* 🔥 CODE IMPORTANT */
const params = new URLSearchParams(window.location.search);

document.getElementById("nom").textContent =
    params.get("nom") || "Client";

document.getElementById("solde").textContent =
    (params.get("solde") || "0") + " FCFA";

document.getElementById("numero").textContent =
    params.get("numero") || "00000000";

</script>

</body>
</html>
