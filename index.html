<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compte Google TV</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d1b2a;
  color:white;
  padding:15px;
}

.card{
  background:linear-gradient(45deg,#1db954,#3ddc84);
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
}

.box{
  background:#1b263b;
  padding:15px;
  border-radius:15px;
  margin-bottom:10px;
}

.btn{
  background:#1abc9c;
  padding:15px;
  text-align:center;
  border-radius:15px;
  margin-top:15px;
  cursor:pointer;
}

.pay{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.pay div{
  background:#eee;
  color:black;
  padding:10px;
  border-radius:10px;
  flex:1;
  text-align:center;
}
</style>

</head>
<body>

<h2 id="nom">Bonjour, Moussa</h2>

<div class="card">
  <p>Montant disponible</p>
  <h1 id="solde">0 FCFA</h1>
</div>

<div class="box">
  Bienvenue sur votre compte Google TV, vos retraits sont directement validés sur votre numéro de retrait ✅
</div>

<div class="box">
  <p>Vues comptées</p>
  <h2 id="vues">1200 vues</h2>
</div>

<div class="box">
  <p>Numéro retrait</p>
  <h2 id="numero">00000000</h2>
</div>

<div class="btn" onclick="alert('Contactez votre leader pour votre retrait')">
💸 Demander un retrait
</div>

<h3>Choisir votre mode de retrait</h3>

<div class="pay">
  <div onclick="alerte()">Orange</div>
  <div onclick="alerte()">MTN</div>
  <div onclick="alerte()">Moov</div>
</div>

<script>
// récupérer les valeurs du lien
const params = new URLSearchParams(window.location.search);

// NOM
document.getElementById("nom").textContent =
"Bonjour, " + (params.get("nom") || "Moussa");

// SOLDE
document.getElementById("solde").textContent =
(params.get("solde") || "0") + " FCFA";

// NUMERO
document.getElementById("numero").textContent =
params.get("numero") || "00000000";

// VUES
document.getElementById("vues").textContent =
(params.get("vues") || "1200") + " vues";

// bouton paiement
function alerte(){
  alert("Contactez votre leader pour votre retrait");
}
</script>

</body>
</html>
