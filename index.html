<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Compte client</title>

<style>
body {
  font-family: Arial;
  background: #0b1c2c;
  color: white;
  padding: 20px;
}

h1 {
  font-size: 22px;
}

.card {
  background: linear-gradient(90deg, #00c853, #69f0ae);
  padding: 20px;
  border-radius: 15px;
  margin-top: 15px;
  font-weight: bold;
  font-size: 20px;
}

.grid {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.box {
  background: #1c2b3a;
  padding: 15px;
  border-radius: 15px;
  flex: 1;
}

button {
  background: #00c853;
  border: none;
  padding: 15px;
  width: 100%;
  color: white;
  border-radius: 10px;
  margin-top: 20px;
  font-size: 16px;
}
</style>
</head>

<body>

<h1 id="nom">Bonjour...</h1>

<div class="card">
  Montant disponible <br>
  <span id="solde"></span>
</div>

<div class="grid">
  <div class="box">
    Vues comptées <br>
    <span id="vues"></span>
  </div>

  <div class="box">
    Numéro retrait <br>
    <span id="numero"></span>
  </div>
</div>

<button>💸 Demander un retrait</button>

<p style="color: yellow;">FRAIS DE RETRAIT NON PAYÉ ❌</p>

<h3>Choisir votre mode de retrait</h3>

<div class="grid">
  <div class="box">Wave</div>
  <div class="box">Tmoney</div>
  <div class="box">Orange</div>
</div>

<div class="grid">
  <div class="box">MTN</div>
  <div class="box">Moov</div>
</div>

<script>
// récupérer les infos du lien
const params = new URLSearchParams(window.location.search);

const nom = params.get("nom") || "Client";
const solde = params.get("solde") || "0";
const vues = params.get("vues") || "0";
const numero = params.get("numero") || "0000000000";

// afficher
document.getElementById("nom").innerText = "Bonjour, " + nom;
document.getElementById("solde").innerText = solde + " FCFA";
document.getElementById("vues").innerText = vues + " vues";
document.getElementById("numero").innerText = numero;
</script>

</body>
</html>
