<!DOCTYPE html>
<html>
<body>
    <h1>Bienvenue sur mon site</h1>
    <p>Nom: <span id="nom"></span></p>
    <p>Solde: <span id="solde"></span></p>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('nom').innerText = params.get('nom') || "Inconnu";
        document.getElementById('solde').innerText = params.get('solde') || "0";
    </script>
</body>
</html>
