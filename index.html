<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compte Client</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#03142d;
color:white;
padding:20px;
}

.app{
max-width:450px;
margin:auto;
}

h1{
font-size:40px;
margin-top:30px;
margin-bottom:30px;
}

.card{
background:linear-gradient(90deg,#00d94f,#34d7c3);
padding:30px;
border-radius:30px;
margin-bottom:30px;
}

.card h2{
font-size:20px;
font-weight:normal;
margin-bottom:20px;
}

.solde{
font-size:55px;
font-weight:bold;
}

.message{
background:#16274c;
padding:30px;
border-radius:25px;
text-align:center;
font-size:22px;
line-height:1.6;
color:#32ff66;
margin-bottom:30px;
}

.boxes{
display:flex;
gap:20px;
margin-bottom:30px;
}

.box{
flex:1;
background:#16274c;
padding:25px;
border-radius:25px;
}

.box h3{
font-size:22px;
margin-bottom:20px;
}

.box p{
font-size:28px;
}

.btn{
background:#22d1ae;
padding:25px;
text-align:center;
border-radius:20px;
font-size:22px;
font-weight:bold;
cursor:pointer;
}

.btn:hover{
opacity:0.9;
}

</style>

</head>

<body>

<div id="contenuSite" style="display:none;">

<div class="app">

<h1 id="nomClient">Bonjour, Moussa</h1>

<div class="card">
<h2>Montant disponible</h2>
<div class="solde" id="soldeClient">325,750 FCFA</div>
</div>

<div class="message">
Bienvenue sur votre compte Google TV.<br><br>
Vos retraits sont directement validés sur votre numéro de retrait.
</div>

<div class="boxes">

<div class="box">
<h3>Vues comptées</h3>
<p id="vuesClient">145,750</p>
</div>

<div class="box">
<h3>Numéro retrait</h3>
<p id="numeroClient">0703079151</p>
</div>

</div>

<div class="btn">
💸 Demande un retrait
</div>

</div>

</div>

<script>

const vraiCode = "570998";

window.onload = function(){

let pin = prompt("Entrez votre code PIN de sécurité");

if(pin !== vraiCode){

alert("Code PIN incorrect");

document.body.innerHTML = `
<div style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#03142d;
color:white;
font-size:30px;
font-family:Arial;
">
Accès refusé
</div>
`;

return;

}

let confirmation = confirm(
"Souhaitez-vous réellement faire votre retrait par Paiement via Mobile Money ?"
);

if(!confirmation){

location.reload();

}else{

document.getElementById("contenuSite").style.display = "block";

}

}

</script>

</body>
</html>
